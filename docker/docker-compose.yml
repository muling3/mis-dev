# Local infra for the MIS PoC.
# Services themselves run on the host (via `make dev`) — Kong reaches them
# through `host.docker.internal`. Add Influx / Vault / observability later.
name: mis-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mis
      POSTGRES_PASSWORD: mis
      POSTGRES_DB: mis_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mis"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      bash -c "mongosh --host mongo:27017 --quiet --eval
      'try { rs.status() } catch (e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] }) }'"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["29092:29092"]

  # Cuckoo Sandbox — community Docker image (`blacktop/cuckoo`). Profile-gated
  # because Cuckoo's behavioural analysis spins up a Windows/Linux VM via KVM,
  # which needs nested-virt + /dev/kvm on the host. On laptops without KVM the
  # container will start and accept submissions, but VM-based dynamic analysis
  # will fail — the sandbox-svc PoC has a deterministic fallback for that case.
  #
  # Bring up with:    docker compose --profile cuckoo up -d cuckoo
  # Web UI:           http://localhost:8090   (Cuckoo's REST + UI port)
  # REST API base:    http://localhost:8090   (sandbox-svc polls /tasks/* here)
  #
  # The sandbox-svc reads CUCKOO_URL from its env (defaults to this URL when
  # the profile is active; falls back to in-process mock otherwise).
  cuckoo:
    image: blacktop/cuckoo:2.0.7
    profiles: ["cuckoo"]
    privileged: true            # required for KVM passthrough
    devices:
      - "/dev/kvm:/dev/kvm"     # nested-virt for the analysis VM
    ports:
      - "8090:8090"             # Cuckoo REST API + Web UI
      - "2042:2042"             # Cuckoo result server (agent → host)
    volumes:
      - cuckoo_storage:/cuckoo/storage
    environment:
      CUCKOO_API_HOST: 0.0.0.0
      CUCKOO_API_PORT: 8090
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/cuckoo/status"]
      interval: 15s
      timeout: 5s
      retries: 8

  # Local SMTP catcher. Notification Service points at maildev:1025 in dev so
  # outbound mail (e.g. "Your document was rejected" on a MALICIOUS Cuckoo
  # verdict) never leaves the laptop. Inspect every captured message at
  # http://localhost:1080.
  maildev:
    image: maildev/maildev:2.1.0
    environment:
      MAILDEV_INCOMING_USER: ""
      MAILDEV_INCOMING_PASS: ""
    ports:
      - "1025:1025"   # SMTP — point SMTP_HOST/SMTP_PORT at this from the host
      - "1080:1080"   # Web UI
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1080"]
      interval: 10s
      timeout: 3s
      retries: 5

  kong:
    image: kong:3.5
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      # Status/metrics listener — Prometheus plugin serves /metrics here.
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_LOG_LEVEL: notice
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8100:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  mongodata:
  cuckoo_storage:
